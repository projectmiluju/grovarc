[project]
name = "grovarc-ai"
version = "0.1.0"
description = "Grovarc AI 서버 — FastAPI + LangGraph Agent"
requires-python = ">=3.12"
dependencies = [
    # Web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",

    # Config
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",

    # Database — PostgreSQL (async)
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pgvector>=0.3.0",

    # Database — MongoDB (async)
    "motor>=3.5.0",
    "beanie>=1.26.0",

    # Cache — Redis
    "redis[asyncio]>=5.0.0",

    # Kafka Consumer
    "aiokafka>=0.11.0",

    # AI / LLM
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "langchain-community>=0.3.0",
    "langgraph>=0.2.0",
    "openai>=1.40.0",
    "anthropic>=0.34.0",

    # Celery scheduler
    "celery[redis]>=5.4.0",

    # Utils
    "python-jose[cryptography]>=3.3.0",
    "tenacity>=8.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
